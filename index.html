<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動照片與影片上傳系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 flex justify-center items-center font-sans text-slate-800">

  <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- 頁頭標題 -->
    <div class="bg-indigo-600 px-6 py-6 text-white text-center relative">
      <!-- 右上角常駐雲端硬碟捷徑 -->
      <a href="https://drive.google.com/drive/folders/1uux_IYtrQIZiVEs5tVzurZeMwsVpS0AO" target="_blank" 
         class="absolute top-4 right-4 bg-white/20 hover:bg-white/30 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition backdrop-blur-sm">
        <i class="fa-solid fa-folder-open"></i>
        <span class="hidden sm:inline">瀏覽資料夾</span>
      </a>

      <div class="inline-flex items-center justify-center w-14 h-14 bg-white/10 rounded-full mb-3">
        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-wide">教學活動照片與影片上傳</h1>
      <p class="text-indigo-100 text-xs mt-1">照片自動壓縮 ‧ 支援短影片 ‧ 支援手機多選與電腦資料夾</p>
    </div>

    <!-- 表單內容 -->
    <div class="p-6 space-y-5">
      <!-- 1. 活動名稱 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">
          <i class="fa-solid fa-tag text-indigo-500 mr-1"></i> 活動名稱
        </label>
        <input type="text" id="activity" required placeholder="例如：校外教學、創客教育、運動會" 
               class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
      </div>

      <!-- 2. 活動日期 與 3. 教師姓名 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">
            <i class="fa-regular fa-calendar-days text-indigo-500 mr-1"></i> 活動日期
          </label>
          <input type="date" id="date" required 
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">
            <i class="fa-solid fa-user-tie text-indigo-500 mr-1"></i> 教師姓名
          </label>
          <input type="text" id="teacher" required placeholder="例如：林老師" 
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
        </div>
      </div>

      <!-- 檔案選取按鈕 (支援照片與影片) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          <i class="fa-solid fa-photo-film text-indigo-500 mr-1"></i> 選取檔案或資料夾
        </label>
        
        <input type="file" id="fileInput" multiple accept="image/*,video/*,.mp4,.mov,.avi,.m4v" class="hidden" onchange="handleFileSelect(this.files)">
        <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" onchange="handleFileSelect(this.files)">

        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="document.getElementById('fileInput').click()" 
                  class="border-2 border-dashed border-indigo-200 hover:border-indigo-500 bg-indigo-50/40 hover:bg-indigo-50 text-indigo-600 rounded-xl p-4 flex flex-col items-center justify-center transition group">
            <i class="fa-solid fa-images text-2xl group-hover:scale-110 transition-transform mb-1.5"></i>
            <span class="text-xs font-bold">選取照片 / 影片</span>
            <span class="text-[10px] text-slate-400 mt-0.5">支援多選 (手機/電腦)</span>
          </button>

          <button type="button" onclick="document.getElementById('folderInput').click()" 
                  class="border-2 border-dashed border-emerald-200 hover:border-emerald-500 bg-emerald-50/40 hover:bg-emerald-50 text-emerald-600 rounded-xl p-4 flex flex-col items-center justify-center transition group">
            <i class="fa-solid fa-folder-open text-2xl group-hover:scale-110 transition-transform mb-1.5"></i>
            <span class="text-xs font-bold">選取整包資料夾</span>
            <span class="text-[10px] text-slate-400 mt-0.5">電腦端專用</span>
          </button>
        </div>
      </div>

      <!-- 檔案清單摘要 -->
      <div id="fileSummary" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-600 flex justify-between items-center">
        <div>已選取：<strong id="totalCount" class="text-indigo-600 text-sm">0</strong> 個檔案</div>
        <div id="totalSize" class="text-slate-400 font-mono">0 MB</div>
      </div>

      <!-- 上傳進度條 -->
      <div id="progressBox" class="hidden space-y-1.5 bg-indigo-50/60 p-4 rounded-xl border border-indigo-100">
        <div class="flex justify-between text-xs font-medium text-indigo-900">
          <span id="progressStatus">準備中...</span>
          <span id="progressPercent" class="font-bold">0%</span>
        </div>
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-200"></div>
        </div>
      </div>

      <!-- 開始上傳按鈕 -->
      <button type="button" id="uploadBtn" onclick="startUpload()" disabled
              class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 disabled:opacity-40 disabled:cursor-not-allowed transition">
        開始上傳
      </button>

      <!-- 成功提示視窗 (含直接前往資料夾按鈕) -->
      <div id="successAlert" class="hidden p-5 rounded-2xl bg-emerald-50 border border-emerald-200 text-center space-y-3 shadow-sm">
        <div class="text-3xl">🎉</div>
        <div>
          <div class="font-bold text-base text-emerald-800">所有檔案已全數成功上傳！</div>
          <p class="text-xs text-emerald-600 mt-0.5">已自動在 Google 雲端硬碟建立活動資料夾歸檔完成。</p>
        </div>
        
        <a href="https://drive.google.com/drive/folders/1uux_IYtrQIZiVEs5tVzurZeMwsVpS0AO" target="_blank" 
           class="inline-flex items-center justify-center gap-2 w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl transition shadow-md shadow-emerald-200">
          <i class="fa-solid fa-folder-open"></i>
          <span>前往雲端硬碟瀏覽活動照片</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const GAS_DEPLOY_URL = "https://script.google.com/macros/s/AKfycbw-j9mK47NHpU45AOLjBckNMH4xG6bjaTXx3szlT-SXF3r_czyU-7VfBFzH8qXGT5Ux/exec";

    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    let fileList = [];

    function handleFileSelect(files) {
      fileList = Array.from(files).filter(f => 
        f.type.startsWith('image/') || 
        f.type.startsWith('video/') || 
        /\.(jpe?g|png|gif|webp|heic|heif|mp4|mov|avi|m4v|webm)$/i.test(f.name)
      );

      if (fileList.length === 0) {
        alert('未偵測到任何有效的圖片或影片檔案！');
        return;
      }

      const oversizedFiles = fileList.filter(f => f.size > 20 * 1024 * 1024);
      if (oversizedFiles.length > 0) {
        const names = oversizedFiles.map(f => f.name).join('\n');
        alert(`⚠️ 注意：以下檔案超過 20 MB，可能會導致上傳失敗：\n${names}\n\n建議剪輯為短影片再上傳！`);
      }

      const totalSizeBytes = fileList.reduce((acc, f) => acc + f.size, 0);
      document.getElementById('totalCount').textContent = fileList.length;
      document.getElementById('totalSize').textContent = (totalSizeBytes / (1024 * 1024)).toFixed(1) + ' MB';
      document.getElementById('fileSummary').classList.remove('hidden');
      document.getElementById('successAlert').classList.add('hidden');
      document.getElementById('uploadBtn').disabled = false;
    }

    function compressImage(file, maxWidth = 1920) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((maxWidth / width) * height);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve({
              base64: canvas.toDataURL('image/jpeg', 0.85),
              type: 'image/jpeg'
            });
          };
          img.onerror = () => reject(new Error('圖片解析失敗'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('檔案讀取失敗'));
        reader.readAsDataURL(file);
      });
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          base64: reader.result,
          type: file.type || 'video/mp4'
        });
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function sendFile(payload) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(res => res.success ? resolve(res) : reject(new Error(res.error)))
            .withFailureHandler(err => reject(err))
            .uploadSingleFile(payload);
        });
      }

      await fetch(GAS_DEPLOY_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload)
      });

      return { success: true };
    }

    async function startUpload() {
      const activity = document.getElementById('activity').value.trim();
      const date = document.getElementById('date').value.trim();
      const teacher = document.getElementById('teacher').value.trim();

      if (!activity || !date || !teacher) {
        alert('請先填寫活動名稱、活動日期與教師姓名！');
        return;
      }

      const btn = document.getElementById('uploadBtn');
      const progressBox = document.getElementById('progressBox');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const progressStatus = document.getElementById('progressStatus');

      btn.disabled = true;
      progressBox.classList.remove('hidden');

      let completedCount = 0;

      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        const isImage = file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp)$/i.test(file.name);

        try {
          let processedData;
          if (isImage) {
            progressStatus.textContent = `壓縮圖片 (${i + 1}/${fileList.length})：${file.name}`;
            processedData = await compressImage(file);
          } else {
            progressStatus.textContent = `讀取影片 (${i + 1}/${fileList.length})：${file.name}`;
            processedData = await readFileAsBase64(file);
          }

          progressStatus.textContent = `上傳中 (${i + 1}/${fileList.length})：${file.name}`;

          const payload = {
            activity: activity,
            date: date,
            teacher: teacher,
            name: file.name,
            type: processedData.type,
            base64: processedData.base64
          };

          await sendFile(payload);

          completedCount++;
          const percent = Math.round((completedCount / fileList.length) * 100);
          progressBar.style.width = percent + '%';
          progressPercent.textContent = percent + '%';

        } catch (err) {
          console.error("Upload error:", err);
          alert(`檔案【${file.name}】上傳失敗：\n${err.message}`);
          btn.disabled = false;
          progressStatus.textContent = "上傳中斷";
          return;
        }
      }

      progressBox.classList.add('hidden');
      document.getElementById('fileSummary').classList.add('hidden');
      document.getElementById('successAlert').classList.remove('hidden');
      btn.textContent = '完成上傳';
      fileList = [];
    }
  </script>
</body>
</html>
